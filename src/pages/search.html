<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search | SheSales</title>

    <meta
        name="description"
        content="Search handmade crochet products from SheSales."
    >

    <link
        rel="stylesheet"
        href="/src/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/layout.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/footer.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/search.css"
    >

</head>


<body>

    <header id="header"></header>


    <main id="main-content">

        <section class="search-page">

            <div class="container">

                <div class="search-heading">

                    <p class="section-eyebrow">
                        Find Your Favorite
                    </p>

                    <h1>
                        Search SheSales
                    </h1>

                    <p class="search-subtitle">
                        Discover handmade crochet pieces
                        crafted with love.
                    </p>

                </div>


                <div class="search-form-wrapper">

                    <form id="searchForm">

                        <div class="search-input-wrapper">

                            <input
                                type="search"
                                id="searchInput"
                                placeholder="Search products..."
                                autocomplete="off"
                            >

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Search
                            </button>

                        </div>

                    </form>

                </div>


                <div
                    id="searchResults"
                    class="search-results"
                >
                </div>


                <div
                    id="emptySearch"
                    class="empty-search"
                    hidden
                >

                    <div class="empty-search-icon">
                        ♡
                    </div>

                    <h2>
                        No products found
                    </h2>

                    <p>
                        Try searching for something else.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer></footer>


    <script
        type="module"
        src="/src/js/search-page.js"
    ></script>

</body>

</html>
