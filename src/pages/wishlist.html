<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Wishlist | SheSales</title>

    <meta
        name="description"
        content="View your favourite handmade crochet pieces from SheSales."
    >

    <!-- Main Styles -->
    <link
        rel="stylesheet"
        href="/src/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/layout.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/src/css/responsive.css"
    >

    <!-- Footer -->
    <link
        rel="stylesheet"
        href="/src/css/footer.css"
    >

    <!-- Wishlist -->
    <link
        rel="stylesheet"
        href="/src/css/wishlist.css"
    >

</head>


<body>

    <!-- HEADER -->

    <header id="header"></header>


    <!-- MAIN CONTENT -->

    <main id="main-content">

        <section class="wishlist-page">

            <div class="container">

                <div class="wishlist-heading">

                    <p class="section-eyebrow">
                        Your Favorites
                    </p>

                    <h1>
                        My Wishlist
                    </h1>

                    <p class="wishlist-subtitle">
                        Pieces you've saved for later.
                    </p>

                </div>


                <!-- WISHLIST PRODUCTS -->

                <div
                    id="wishlistGrid"
                    class="wishlist-grid"
                >
                </div>


                <!-- EMPTY WISHLIST -->

                <div
                    id="emptyWishlist"
                    class="empty-wishlist"
                    hidden
                >

                    <div class="empty-wishlist-icon">
                        ♡
                    </div>

                    <h2>
                        Your wishlist is empty
                    </h2>

                    <p>
                        You haven't saved any handmade
                        favorites yet.
                    </p>

                    <a
                        href="/src/pages/marketplace.html"
                        class="btn btn-primary"
                    >
                        Explore Marketplace
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer></footer>


    <!-- PAGE SCRIPT -->

    <script
        type="module"
        src="/src/js/wishlist-page.js"
    ></script>

</body>

</html>
