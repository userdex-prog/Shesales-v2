<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="SheSales Admin Login"
>

<title>Admin Login | SheSales</title>

<link
    rel="stylesheet"
    href="/src/css/global.css"
>

<link
    rel="stylesheet"
    href="/src/css/layout.css"
>

<link
    rel="stylesheet"
    href="/src/css/admin.css"
>


</head>

<body>


<main class="admin-login-page">

    <div class="admin-login-card">

        <a
            href="/"
            class="admin-login-logo"
        >
            <span>She</span>Sales
        </a>


        <div class="admin-login-heading">

            <span class="admin-login-eyebrow">
                Administration
            </span>

            <h1>
                Welcome Back
            </h1>

            <p>
                Sign in to manage your SheSales store.
            </p>

        </div>


        <form
            id="admin-login-form"
            class="admin-login-form"
        >

            <div class="admin-form-group">

                <label for="admin-email">
                    Email
                </label>

                <input
                    type="email"
                    id="admin-email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <p
                id="admin-login-error"
                class="admin-login-error"
                role="alert"
                hidden
            ></p>


            <button
                type="submit"
                class="admin-btn admin-btn-primary admin-login-btn"
            >
                Sign In
            </button>

        </form>


        <a
            href="/"
            class="admin-login-back"
        >
            ← Back to Store
        </a>

    </div>

</main>


<script
    type="module"
    src="/src/js/admin-login.js"
></script>


</body>

</html>
